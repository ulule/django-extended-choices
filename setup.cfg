[metadata]
name = django-extended-choices
version = 1.3.3
author = Stephane "Twidi" Angel
author_email = s.angel@twidi.com
url = https://github.com/twidi/django-extended-choices
description = Little helper application to improve django choices (for fields)
long_description = file: README.rst
license = BSD-3-Clause
license_files = LICENSE
keywords = redis, orm, jobs, queue
platform = any
classifiers =
    Development Status :: 5 - Production/Stable
    Framework :: Django
    Framework :: Django :: 1.8
    Framework :: Django :: 1.9
    Framework :: Django :: 1.10
    Framework :: Django :: 1.11
    Framework :: Django :: 2.0
    Framework :: Django :: 2.1
    Framework :: Django :: 2.2
    Operating System :: OS Independent
    Intended Audience :: Developers
    Programming Language :: Python
    Programming Language :: Python :: 3
    Topic :: Software Development :: Libraries
    Topic :: Software Development :: Libraries :: Python Modules

[options]
zip_safe = False
packages = extended_choices
python_requires = >=3

[options.package_data]
extended_choices = py.typed

[options.extras_require]
dev =
    django
doc =
    django
    sphinx
    sphinxcontrib-napoleon
    sphinx_rtd_theme
typing =
    mypy==2.4.1
    django-stubs==6.1.2

[mypy]
files = extended_choices
# ``tests.py`` is a legacy, untyped suite using APIs removed from recent Django (``ugettext_lazy``).
exclude = extended_choices/tests\.py
python_version = 3.10
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
